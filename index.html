<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gibbs Market Watch</title>

    <style>
        body {
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            font-size: 36px;
            letter-spacing: 3px;
        }

        h2 {
            color: #94a3b8;
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 30px;
            margin: 35px auto;
            max-width: 550px;
        }

        .status {
            color: #facc15;
            font-size: 24px;
            font-weight: bold;
        }

        .rule {
            font-size: 22px;
            margin: 25px 0;
        }
    </style>
</head>

<body>

    <h1>GIBBS MARKET WATCH</h1>

    <h2>Financial Market Dashboard</h2>

    <div class="card">

        <h2>USD/TWD Market Indicator</h2>

        <div class="rule">
            USD/TWD &gt; 20MA &gt; 60MA
        </div>

        <div class="status">
            MARKET MONITORING
        </div>

        <p>台股市場觀察系統</p>

        <p>Market data integration coming soon.</p>

    </div>

</body>
</html>
