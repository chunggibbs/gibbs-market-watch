<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820"><title>Gibbs Market Watch</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#fff;background:#101820}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,650px);text-align:center}h1{font-size:clamp(26px,6vw,40px);letter-spacing:.12em;margin:0 0 8px}header p{color:#a6b7cc;margin:0 0 38px}
.card{background:#1e293b;border-radius:18px;padding:clamp(26px,7vw,55px);box-shadow:0 12px 40px #0004}
.caption{color:#b7c8de;letter-spacing:.15em;font-size:17px}.rate{font-size:clamp(54px,13vw,88px);font-weight:750;letter-spacing:.025em;margin:22px 0 28px;font-variant-numeric:tabular-nums}
.status{display:flex;justify-content:center;align-items:center;gap:14px;font-size:clamp(17px,4vw,23px);font-weight:700;line-height:1.5}
.light{width:28px;height:28px;border-radius:50%;background:#8a95a6;flex-shrink:0}.orange .light{background:#ff961a;box-shadow:0 0 22px #ff961a88}.blue .light{background:#359cff;box-shadow:0 0 22px #359cff88}
.date{color:#b7c8de;margin-top:35px;font-size:14px}.note{color:#8193ac;font-size:12px;margin-top:16px;line-height:1.7}
</style>
</head>
<body><main><header><h1>GIBBS MARKET WATCH</h1><p>Financial Market Dashboard</p></header>
<section class="card" id="card"><div class="caption">USD / TWD</div><div class="rate" id="rate">—</div>
<div class="status"><span class="light" aria-hidden="true"></span><span id="status">讀取資料中…</span></div>
<div class="date" id="date">最新資料日期：—</div><div class="note">資料來源：Yahoo Finance · 每日台灣時間19:00排程更新<br>非即時報價；燈號僅供市場觀察。</div></section></main>
<script>
(async()=>{try{const response=await fetch('market_data.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('尚未取得匯率資料');const d=await response.json();if(!['orange','blue','neutral'].includes(d.signal)||!Number.isFinite(Number(d.close)))throw Error('資料格式錯誤');document.getElementById('card').classList.add(d.signal);document.getElementById('rate').textContent=Number(d.close).toFixed(4);document.getElementById('status').textContent=d.signal==='orange'?'台幣偏弱｜注意持股風險':d.signal==='blue'?'台幣偏強':'中性｜持續觀察';document.getElementById('date').textContent='最新資料日期：'+d.date;}catch(e){document.getElementById('status').textContent='資料尚未就緒';document.getElementById('date').textContent='請先執行 GitHub Actions 更新資料';}})();
</script></body></html>
