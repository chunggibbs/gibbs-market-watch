name: Update Taiwan Margin Financing Data

on:
  schedule:
    # Taiwan 21:00 = UTC 13:00
    - cron: "0 13 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-margin:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch margin financing data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python fetch_margin.py

      - name: Commit margin data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add margin_data.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Taiwan margin financing data"
            git push
          fi
