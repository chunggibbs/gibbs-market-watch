name: Update Futures Foreign Open Interest

on:
  schedule:
    # 台灣時間週一至週五 19:00 = UTC 11:00；FinMind 官方預定 18:00 更新
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-futures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Fetch futures data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update_futures.py
      - name: Commit JSON if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add futures_data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update futures foreign open interest'
            git push
          fi
