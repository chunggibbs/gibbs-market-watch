name: Update USD TWD

on:
  schedule:
    # 每天台灣時間 19:00（UTC 11:00）
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-usdtwd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update USD TWD data
        run: python update_usdtwd.py

      - name: Commit updated market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update USD TWD market data"
            git push
          fi
