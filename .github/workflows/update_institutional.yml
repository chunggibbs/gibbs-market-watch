name: Update Institutional Investors

on:
  schedule:
    # 台灣時間週一至週五 17:30（UTC 09:30）
    - cron: '30 9 * * 1-5'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-institutional
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Update institutional data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python update_institutional.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add institutional_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update institutional investor data"
            git push
          fi
